
<!DOCTYPE html>

<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
        <link rel="icon" href="img/pez.png" type="image/png">
        <title>El periquito que lo sabe todo</title>
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">    
        
    </head>

    <body class="inter-font">

        <div class="container">

            <!-- Inicio del titulo -->
            
            <div class="row mt-4">

                <div class="col-12">

                    <p class="text-primary text-center titulo mb-0 fs-5-peque " >Valeria Cáceres, érase un pez azul</p>

                </div>

            </div>

            <!-- Fin del titulo -->

            <!-- Inicio del navbar -->

            <div id="navbar">

            </div>
            
            <!-- Fin del navbar -->

            <div class="row mt-3 d-flex justify-content-around">
                
                <div class="col-12 border p-4">

                    <p><span class="fw-bold">El periquito que lo sabe todo pero no entiende nada</span></p>

                </div>

            </div>

            <div id="contenedorDeImagenGrande">

                <span id="botonCerrar">×</span>
                <img id="imagenGrande" width="500">

            </div>

            <!--Inicio de galeria-->

            <div id="galeria">
                

            </div>

            <!--Fin de galeria-->

            <!-- Inicio del footer -->

            <div id="footer">

            </div>

            <!-- Fin del footer -->

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/generar_imagenes_de_galeria.js"></script>
        <script src="js/componentes/navbar.js"></script>
        <script src="js/componentes/footer.js"></script>

        <script>

            document.getElementById("navbar").innerHTML = getNavbar();
            document.getElementById("footer").innerHTML = getFooter();

            const botonCerrar = document.getElementById("botonCerrar");
            const contenedorDeImagenGrande = document.getElementById("contenedorDeImagenGrande");

            botonCerrar.addEventListener("click", () =>
            {
                contenedorDeImagenGrande.style.display = "none"
            });

            generar_imagenes_de_galeria(8, "el_periquito_que_lo_sabe_todo");

        </script>

    </body>

</html>
